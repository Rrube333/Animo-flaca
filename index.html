      <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Un pequeño universo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--cream:#fff7ed;--ink:#33263c}
  html,body{width:100%;height:100%;overflow:hidden;background:#101b39;font-family:Georgia,"Times New Roman",serif;touch-action:none;cursor:crosshair}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  .top{
    position:fixed;z-index:5;top:0;left:0;width:100%;
    display:flex;justify-content:center;padding:clamp(18px,4vw,34px) 18px 0;
    pointer-events:none;
  }
  .message{
    text-align:center;color:var(--cream);max-width:760px;
    text-shadow:0 3px 20px rgba(20,12,40,.35);
    opacity:0;transform:translateY(-14px);
    animation:intro 1.2s .3s ease forwards;
  }
  .eyebrow{font:600 11px/1.2 Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;opacity:.78;margin-bottom:9px}
  h1{font-size:clamp(30px,6vw,64px);font-weight:500;line-height:.95;letter-spacing:-1px}
  .subtitle{margin-top:11px;font-size:clamp(14px,2.3vw,18px);line-height:1.45;opacity:.88}

  .hint{
    position:fixed;z-index:5;left:50%;bottom:26px;transform:translateX(-50%);
    color:rgba(255,247,237,.84);font:12px/1.4 Arial,sans-serif;letter-spacing:.4px;
    padding:9px 14px;border:1px solid rgba(255,255,255,.12);border-radius:999px;
    background:rgba(15,25,52,.18);backdrop-filter:blur(8px);
    transition:opacity .5s ease;pointer-events:none;white-space:nowrap;
  }

  .counter{
    position:fixed;z-index:6;left:18px;top:18px;
    display:flex;align-items:center;gap:8px;
    color:rgba(255,247,237,.92);font:600 12px Arial,sans-serif;
    padding:10px 13px;border-radius:999px;
    background:rgba(15,25,52,.2);border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(9px);box-shadow:0 8px 28px rgba(15,10,30,.12)
  }
  .heart{font-size:14px;filter:drop-shadow(0 2px 7px rgba(255,171,203,.6))}

  #reset{
    position:fixed;right:18px;top:18px;z-index:6;
    width:42px;height:42px;border:1px solid rgba(255,255,255,.13);border-radius:50%;
    background:rgba(15,25,52,.2);backdrop-filter:blur(9px);
    display:grid;place-items:center;cursor:pointer;opacity:.68;transition:.3s;
  }
  #reset:hover{opacity:1;transform:rotate(-18deg) scale(1.06)}
  #reset svg{width:18px;height:18px}

  .toast{
    position:fixed;z-index:10;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(.94);
    color:#35263e;background:rgba(255,247,237,.94);
    border:1px solid rgba(255,255,255,.65);border-radius:20px;
    padding:15px 20px;max-width:min(86vw,430px);text-align:center;
    font-size:15px;line-height:1.45;
    box-shadow:0 20px 60px rgba(15,10,35,.25);
    opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
    backdrop-filter:blur(12px)
  }
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0
  }

  @keyframes intro{to{opacity:1;transform:translateY(0)}}
  @media (max-width:600px){
    .top{padding-top:72px}
    .message{max-width:90vw}
    .counter{left:12px;top:12px}
    #reset{right:12px;top:12px}
    .hint{bottom:16px;font-size:11px}
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<div class="counter"><span class="heart">♡</span><span id="count">0 flores sembradas</span></div>

<div class="top">
  <div class="message">
    <div class="eyebrow">un pequeño universo</div>
    <h1>Ánimo, flaca</h1>
    <div class="subtitle">Mueve el cursor y escucha al viento. Toca cualquier parte del prado para dejar una flor.</div>
  </div>
</div>

<div class="hint" id="hint">Toca el prado para sembrar una flor ✦</div>

<button id="reset" aria-label="Reiniciar el prado" title="Reiniciar">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff7ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 1 0 3-6.7"/>
    <path d="M3 4v5h5"/>
  </svg>
</button>

<div class="toast" id="toast"></div>
<span class="sr-only">Mueve el cursor o el dedo para mover el viento. Toca para sembrar flores. Cada flor queda guardada en este navegador.</span>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const resetBtn = document.getElementById('reset');
  const countEl = document.getElementById('count');
  const hint = document.getElementById('hint');
  const toast = document.getElementById('toast');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STORAGE_KEY = 'prado-blooms-v2';

  let W=0,H=0,DPR=1;
  let field=[], flowers=[], fireflies=[], petals=[], motes=[];
  let toastTimer=null;
  let lastTime=0;

  const palette = ['#f8adc0','#d7b4ef','#f7d88c','#ffc2a6','#afc8f3','#fff0dc','#eabbd7','#d7e6b5'];
  const pointer = {x:-9999,y:-9999,active:false};

  const rand=(a,b)=>Math.random()*(b-a)+a;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  function lerpColor(c1,c2,t){
    const a=parseInt(c1.slice(1),16), b=parseInt(c2.slice(1),16);
    const ar=a>>16, ag=(a>>8)&255, ab=a&255;
    const br=b>>16, bg=(b>>8)&255, bb=b&255;
    return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
  }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildField();
    buildAtmosphere();
  }

  function buildField(){
    const meadowTop=H*.43;
    const count=clamp(Math.floor(W*H/8500),65,210);
    field=[];
    for(let i=0;i<count;i++){
      const baseY=rand(meadowTop,H*1.01);
      const depth=clamp((baseY-meadowTop)/(H-meadowTop),0,1);
      field.push({
        x:rand(-30,W+30), y:baseY,
        h:rand(26,43)+depth*47,
        c:pick(palette), kind:Math.floor(rand(0,4)),
        speed:rand(.5,1.25), phase:rand(0,Math.PI*2),
        angle:0, alpha:.45+.45*depth, width:1.2+depth*1.1,
        special:false, birth:0
      });
    }
    for(const f of flowers) field.push(makeStem(f.x,f.y,f.h,f.c,f.kind,true,true));
  }

  function buildAtmosphere(){
    fireflies=[];
    motes=[];
    const fCount=reduceMotion?0:Math.min(26,Math.floor(W/52));
    for(let i=0;i<fCount;i++){
      fireflies.push({x:rand(0,W),y:rand(H*.18,H*.83),vx:rand(-.12,.12),vy:rand(-.08,.08),phase:rand(0,Math.PI*2),r:rand(1.1,2.1)});
    }
    const mCount=reduceMotion?0:Math.min(45,Math.floor(W/30));
    for(let i=0;i<mCount;i++){
      motes.push({x:rand(0,W),y:rand(H*.08,H*.72),vx:rand(-.08,.08),vy:rand(-.04,.04),phase:rand(0,Math.PI*2),r:rand(.5,1.4)});
    }
  }

  function makeStem(x,y,h,c,kind,special=false,instant=false){
    return {
      x,y,h,c,kind,special,speed:rand(.5,1),phase:rand(0,Math.PI*2),angle:0,
      birth:instant?-Infinity:performance.now(),scale:instant?1:0,alpha:1
    };
  }

  function easeBack(t){
    const c1=1.70158,c3=c1+1;
    return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);
  }

  function drawSky(t){
    const cycle=(Math.sin(t*.000045)+1)/2;
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,lerpColor('#111c3a','#253865',cycle));
    g.addColorStop(.38,lerpColor('#3f4d83','#87658f',cycle));
    g.addColorStop(.7,lerpColor('#d39aa5','#e7b9aa',cycle));
    g.addColorStop(1,lerpColor('#f3c9a6','#f1d4bb',cycle));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // soft glow near horizon
    const glow=ctx.createRadialGradient(W*.5,H*.57,0,W*.5,H*.57,Math.max(W,H)*.6);
    glow.addColorStop(0,'rgba(255,232,203,.25)');
    glow.addColorStop(1,'rgba(255,232,203,0)');
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

    // moon
    const mx=W*.83,my=H*.19,mr=Math.min(W,H)*.065;
    ctx.save();
    ctx.shadowColor='rgba(255,244,215,.35)';ctx.shadowBlur=28;
    ctx.beginPath();ctx.arc(mx,my,mr,0,Math.PI*2);
    ctx.fillStyle='rgba(255,243,212,.9)';ctx.fill();
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath();ctx.arc(mx+mr*.38,my-mr*.15,mr*.92,0,Math.PI*2);ctx.fill();
    ctx.restore();

    // stars
    ctx.save();
    for(let i=0;i<55;i++){
      const x=(i*97.31)%W;
      const y=22+((i*53.17)%(H*.35));
      const tw=.35+.65*(Math.sin(t*.0013+i*1.7)*.5+.5);
      ctx.globalAlpha=tw*(.42+.58*(1-y/(H*.35)));
      ctx.fillStyle='#fff6df';
      ctx.beginPath();ctx.arc(x,y,(i%7===0?1.4:.75),0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  function drawHills(){
    const base=H*.53;
    ctx.beginPath();
    ctx.moveTo(0,H);ctx.lineTo(0,base+H*.02);
    ctx.quadraticCurveTo(W*.2,base-H*.045,W*.43,base+H*.03);
    ctx.quadraticCurveTo(W*.67,base+H*.1,W,base-H*.005);
    ctx.lineTo(W,H);ctx.closePath();
    ctx.fillStyle='rgba(75,94,89,.48)';ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0,H);ctx.lineTo(0,base+H*.15);
    ctx.quadraticCurveTo(W*.27,base+H*.08,W*.53,base+H*.16);
    ctx.quadraticCurveTo(W*.78,base+H*.22,W,base+H*.12);
    ctx.lineTo(W,H);ctx.closePath();
    ctx.fillStyle='rgba(52,76,66,.66)';ctx.fill();

    // distant haze
    const haze=ctx.createLinearGradient(0,H*.46,0,H*.8);
    haze.addColorStop(0,'rgba(255,225,207,.05)');
    haze.addColorStop(1,'rgba(30,61,50,.17)');
    ctx.fillStyle=haze;ctx.fillRect(0,H*.44,W,H*.4);
  }

  function drawFlowerHead(x,y,s,c,kind,angle,glow=false){
    ctx.save();ctx.translate(x,y);ctx.rotate(angle*.32);
    if(glow){ctx.shadowColor=c;ctx.shadowBlur=18*s;}

    if(kind===0){
      for(let i=0;i<8;i++){
        ctx.save();ctx.rotate(i*Math.PI/4);
        ctx.beginPath();ctx.ellipse(0,-7*s,3*s,7.5*s,0,0,Math.PI*2);
        ctx.fillStyle=c;ctx.globalAlpha=.93;ctx.fill();ctx.restore();
      }
      ctx.beginPath();ctx.arc(0,0,4*s,0,Math.PI*2);ctx.fillStyle='#f8d78d';ctx.fill();
    }else if(kind===1){
      for(let i=0;i<6;i++){
        const a=i*Math.PI/3, d=5.8*s;
        ctx.beginPath();ctx.arc(Math.cos(a)*d,Math.sin(a)*d,4.8*s,0,Math.PI*2);
        ctx.fillStyle=c;ctx.globalAlpha=.88;ctx.fill();
      }
      ctx.beginPath();ctx.arc(0,0,3*s,0,Math.PI*2);ctx.fillStyle='#f4e5c9';ctx.fill();
    }else if(kind===2){
      ctx.fillStyle=c;
      ctx.beginPath();
      ctx.moveTo(0,-19*s);
      ctx.bezierCurveTo(7*s,-14*s,7*s,-4*s,0,1*s);
      ctx.bezierCurveTo(-7*s,-4*s,-7*s,-14*s,0,-19*s);ctx.fill();
      ctx.save();ctx.rotate(-.42);ctx.globalAlpha=.8;
      ctx.beginPath();ctx.moveTo(0,-16*s);ctx.bezierCurveTo(5*s,-12*s,5*s,-3*s,0,2*s);ctx.bezierCurveTo(-5*s,-3*s,-5*s,-12*s,0,-16*s);ctx.fill();
      ctx.restore();
      ctx.save();ctx.rotate(.42);ctx.globalAlpha=.65;
      ctx.beginPath();ctx.moveTo(0,-16*s);ctx.bezierCurveTo(5*s,-12*s,5*s,-3*s,0,2*s);ctx.bezierCurveTo(-5*s,-3*s,-5*s,-12*s,0,-16*s);ctx.fill();
      ctx.restore();
      ctx.beginPath();ctx.arc(0,-1*s,2.4*s,0,Math.PI*2);ctx.fillStyle='#ffe1a6';ctx.fill();
    }else{
      ctx.strokeStyle=c;ctx.lineWidth=2*s;ctx.lineCap='round';
      for(let i=0;i<5;i++){
        const a=-Math.PI/2+i*.5;
        ctx.beginPath();ctx.moveTo(0,2*s);ctx.quadraticCurveTo(Math.cos(a)*9*s,Math.sin(a)*9*s,Math.cos(a)*13*s,Math.sin(a)*13*s);ctx.stroke();
      }
      ctx.beginPath();ctx.arc(0,1*s,3.2*s,0,Math.PI*2);ctx.fillStyle='#f8d58d';ctx.fill();
    }
    ctx.restore();
  }

  function updateField(t){
    const globalWind=Math.sin(t*.00024)*.11;
    for(const s of field){
      let sc=1;
      if(s.special && s.birth!==-Infinity){
        const e=(t-s.birth)/700;
        sc=e>=1?1:(e<0?0:easeBack(clamp(e,0,1)));
      }
      s.scale=Math.max(0,sc); if(!s.scale) continue;

      const micro=Math.sin(t*.0013*s.speed+s.phase)*.05;
      let push=0;
      if(pointer.active){
        const dx=s.x-pointer.x, dy=(s.y-s.h*.65)-pointer.y;
        const dist=Math.hypot(dx,dy), radius=175;
        if(dist<radius) push=(dx>=0?1:-1)*(1-dist/radius)*.62;
      }
      const target=globalWind+micro+push;
      s.angle+=(target-s.angle)*.12;

      const h=s.h*s.scale;
      const topX=s.x+Math.sin(s.angle)*h;
      const topY=s.y-Math.cos(s.angle)*h;
      const cx=s.x+Math.sin(s.angle)*h*.5;
      const cy=s.y-Math.cos(s.angle)*h*.5;

      ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo(cx,cy,topX,topY);
      ctx.strokeStyle=s.special?'#527b52':'#71986f';
      ctx.globalAlpha=s.special?s.scale:s.alpha;
      ctx.lineWidth=s.special?2.55:s.width||1.7;ctx.lineCap='round';ctx.stroke();ctx.globalAlpha=1;
      drawFlowerHead(topX,topY,(s.special?1.33:.82)*s.scale,s.c,s.kind,s.angle,s.special);
    }
  }

  function updateFireflies(t){
    for(const f of fireflies){
      f.x+=f.vx+Math.sin(t*.0005+f.phase)*.06;
      f.y+=f.vy+Math.cos(t*.00045+f.phase)*.05;
      if(f.x<-10)f.x=W+10;if(f.x>W+10)f.x=-10;
      if(f.y<H*.08)f.y=H*.82;if(f.y>H*.86)f.y=H*.08;
      const a=.2+.8*(Math.sin(t*.003+f.phase)*.5+.5);
      ctx.save();ctx.globalAlpha=a;ctx.shadowColor='#ffeaa7';ctx.shadowBlur=16;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fillStyle='#fff1bb';ctx.fill();ctx.restore();
    }
  }

  function updateMotes(t){
    for(const m of motes){
      m.x+=m.vx+Math.sin(t*.0007+m.phase)*.08;
      m.y+=m.vy;
      if(m.x<0)m.x=W;if(m.x>W)m.x=0;
      if(m.y<H*.05)m.y=H*.72;if(m.y>H*.75)m.y=H*.05;
      ctx.save();ctx.globalAlpha=.05+.11*(Math.sin(t*.001+m.phase)*.5+.5);
      ctx.fillStyle='#fff4d8';ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }

  function spawnPetal(){
    if(reduceMotion)return;
    petals.push({
      x:rand(0,W),y:-15,vy:rand(.45,.95),phase:rand(0,Math.PI*2),rot:rand(0,Math.PI*2),
      rs:rand(-.025,.025),c:pick(palette),s:rand(3.5,7)
    });
  }

  function updatePetals(t){
    for(let i=petals.length-1;i>=0;i--){
      const p=petals[i];p.y+=p.vy;p.x+=Math.sin(t*.001+p.phase)*.62;p.rot+=p.rs;
      if(p.y>H+20){petals.splice(i,1);continue}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=.78;ctx.fillStyle=p.c;
      ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.58,0,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }

  function save(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(flowers.slice(-180)))}catch(e){}
  }

  function load(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      flowers=raw?JSON.parse(raw):[];
      if(!Array.isArray(flowers))flowers=[];
    }catch(e){flowers=[]}
    updateCounter();
  }

  function updateCounter(){
    const n=flowers.length;
    countEl.textContent=n===0?'0 flores sembradas':`${n} ${n===1?'flor':'flores'} sembradas`;
  }

  function showToast(text){
    toast.textContent=text;toast.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2300);
  }

  function plantAt(x,y){
    // evita plantar en las esquinas de controles
    if(y<76 && (x<90 || x>W-90)) return;
    const flower={
      x,y,h:rand(82,128),c:pick(palette),kind:Math.floor(rand(0,4))
    };
    flowers.push(flower);
    if(flowers.length>180)flowers.shift();

    const stem=makeStem(flower.x,flower.y,flower.h,flower.c,flower.kind,true,false);
    field.push(stem);

    // pequeña ráfaga de polen
    if(!reduceMotion){
      for(let i=0;i<10;i++){
        motes.push({
          x,y,vx:rand(-1.2,1.2),vy:rand(-1.3,-.2),phase:rand(0,Math.PI*2),r:rand(.6,1.7),life:1
        });
      }
    }

    updateCounter();save();
    hint.style.opacity='0';
    if(flowers.length===1)showToast('Una flor para guardar este instante ✦');
  }

  function loop(t){
    const dt=Math.min(32,t-lastTime||16); lastTime=t;
    ctx.clearRect(0,0,W,H);
    drawSky(t);
    drawHills();
    updateMotes(t);
    updateFireflies(t);
    updatePetals(t);
    updateField(t);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize',resize);
  window.addEventListener('pointermove',e=>{
    pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true;
  },{passive:true});
  window.addEventListener('pointerleave',()=>{
    pointer.x=-9999;pointer.y=-9999;pointer.active=false;
  });

  document.body.addEventListener('pointerdown',e=>{
    if(e.target.closest('#reset'))return;
    plantAt(e.clientX,e.clientY);
  });

  resetBtn.addEventListener('click',()=>{
    if(flowers.length===0){showToast('Todavía no hay flores que reiniciar.');return}
    field=field.filter(s=>!s.special);flowers=[];
    try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
    updateCounter();hint.style.opacity='1';
    showToast('El prado vuelve a empezar… ✦');
  });

  setInterval(spawnPetal,reduceMotion?999999:1250);

  load();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
